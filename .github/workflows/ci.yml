# CI workflow for Trinethra
# Runs on push to main and pull requests
# It installs dependencies, starts an Ollama container, pulls the Llama model, then runs tests.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      # Start Ollama container
      - name: Start Ollama container
        run: |
          docker run -d --name ollama -p 11434:11434 ollama/ollama:latest

      # Wait for Ollama to be ready
      - name: Wait for Ollama
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/tags > /dev/null; then
              echo "Ollama ready"
              break
            fi
            echo "Waiting for Ollama..."
            sleep 2
          done

      # Pull the Llama model inside the container
      - name: Pull Llama model
        run: |
          docker exec ollama ollama pull llama3.2

      # Wait for model to load
      - name: Wait for model to be ready
        run: |
          sleep 20

      - name: Run backend tests
        working-directory: ./backend
        run: npm test -- --passWithNoTests

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build Docker image
        run: |
          docker build -t trinethra-backend ./backend
          docker build -t trinethra-frontend ./frontend

      - name: Stop Ollama container
        if: always()
        run: |
          docker stop ollama && docker rm ollama
